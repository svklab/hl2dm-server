// HL2MP Server Config file
// mostly the default settings with rate limits set to prevent massive lag
// put this file (server.cfg) in the cfg folder (this file is for HL2DM SRCDS servers only)

hostname "HL2DM Server -- Happy gaming"
// Weapon and item respawn times
sv_hl2mp_weapon_respawn_time 5
sv_hl2mp_item_respawn_time 10

// Game mode settings
mp_teamplay 0
mp_friendlyfire 0
mp_falldamage 5
mp_weaponstay 0
mp_forcerespawn 0
mp_allowspectators 0

// Player settings
mp_footsteps 1
mp_flashlight 1
mp_autocrosshair 1
mp_allowNPCs 1

// Physics settings
sv_gravity 450
sv_friction 4
sv_waterfriction 1
sv_stopspeed 100
sv_accelerate 10
sv_airaccelerate 10
sv_wateraccelerate 10
sv_maxspeed 320
sv_stepsize 18

// Spectator settings
sv_noclipaccelerate 5
sv_noclipspeed 5
sv_specaccelerate 5
sv_specspeed 3
sv_specnoclip 1

// Physics misc
sv_rollspeed 200
sv_rollangle 0
sv_bounce 0

// Voice and chat
sv_alltalk 1
sv_voiceenable 1
sv_voicecodec vaudio_miles

// Server control
sv_pausable 0
sv_cheats 0
coop 0
deathmatch 1
sv_lan 0

// Downloads and sprays
sv_allowupload 1
sv_allowdownload 1

// Network and bandwidth settings
sv_maxrate 0
sv_minrate 3500
sv_maxupdaterate 60
sv_minupdaterate 10
sv_maxunlag 1
sv_unlag 1
sv_timeout 65
sv_instancebaselines 0
sv_forcepreload 1

// Physics limits
sv_robust_explosions 0
sv_maxvelocity 3000

// RCON settings
sv_rcon_banpenalty 0
sv_rcon_maxfailures 10
sv_rcon_minfailures 5
sv_rcon_minfailuretime 30

// Server region (0=US East, 1=US West, 2=South America, 3=Europe, 4=Asia, 5=Australia, 6=Middle East, 7=Africa, 8=Japan, 255=World)
sv_region 3

// Server info
sv_stats 1
sv_contact ""
sv_hltv 0

// Ban filtering
sv_filterban 1

// Logging
sv_logbans 1
sv_logfile 1
sv_log_onefile 0
log on

// Execute ban lists (create empty files if they don't exist)
exec banned_user.cfg
exec banned_ip.cfg

// Game limits
mp_fraglimit 50
mp_timelimit 20
